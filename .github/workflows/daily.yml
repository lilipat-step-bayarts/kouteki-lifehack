name: 1日5回 記事自動更新＆X自動分散ポスト

on:
  schedule:
    # 1日5回（日本時間 JST 07:00, 10:00, 12:15, 18:00, 21:00）に自動分散配信
    - cron: '0 22 * * *'  # 07:00 JST（朝の通勤速報）
    - cron: '0 1 * * *'   # 10:00 JST（午前の知恵袋）
    - cron: '15 3 * * *'  # 12:15 JST（お昼休みのスマホ閲覧ピーク）
    - cron: '0 9 * * *'   # 18:00 JST（退勤・夕方ハック）
    - cron: '0 12 * * *'  # 21:00 JST（夜のリラックス・まとめ）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Node.js環境のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 新着記事の自動生成＆静的サイトビルド（1号店＋2号店）
        run: |
          python3 scripts/generate_articles.py
          python3 store2/scripts/generate_articles.py
          python3 scripts/build_site.py --build-only

      - name: Cloudflare Pagesへ本番自動デプロイ（1号店＋2号店）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 1号店 (kouteki-lifehack) の本番ブランチを取得してデプロイ
          PROD_BRANCH_1=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/kouteki-lifehack" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',{}).get('production_branch','main'))" 2>/dev/null || echo "main")
          echo "Deploying Store 1 to production branch: ${PROD_BRANCH_1}"
          npx wrangler pages deploy dist --project-name=kouteki-lifehack --branch="${PROD_BRANCH_1}" --commit-dirty=true
          if [ "${PROD_BRANCH_1}" != "main" ]; then
            npx wrangler pages deploy dist --project-name=kouteki-lifehack --branch=main --commit-dirty=true || true
          fi

          # 2号店 (cosme-lab-ikero) の本番ブランチを取得してデプロイ
          PROD_BRANCH_2=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/cosme-lab-ikero" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',{}).get('production_branch','main'))" 2>/dev/null || echo "main")
          echo "Deploying Store 2 to production branch: ${PROD_BRANCH_2}"
          (cd store2 && npx wrangler pages deploy dist --project-name=cosme-lab-ikero --branch="${PROD_BRANCH_2}" --commit-dirty=true)
          if [ "${PROD_BRANCH_2}" != "main" ]; then
            (cd store2 && npx wrangler pages deploy dist --project-name=cosme-lab-ikero --branch=main --commit-dirty=true) || true
          fi

      - name: X（旧Twitter）自動分散ポスト（1日5回の定時スケジュールで1記事ずつ投稿）
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 scripts/distribute_tweet.py || echo "Store 1 tweet skipped"
          else
            echo "Manual run: Store 1 tweet skipped (already posted for morning slot)"
          fi
          python3 store2/scripts/distribute_tweet.py || echo "Store 2 tweet skipped"

      - name: 生成した記事・ビルド成果物・投稿履歴をGitHubに自動コミット＆保存
        run: |
          git config --global user.name "Hoporin AutoBot"
          git config --global user.email "bot@kouteki-lifehack.pages.dev"
          git add -A articles/ dist/ store2/articles/ store2/dist/ .tweet_history.json store2/.tweet_history.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore(auto): 1号店・2号店の記事更新＆本番デプロイ同期 [skip ci]" && git push)
