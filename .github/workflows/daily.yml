name: 1日5回 記事自動更新＆X自動分散ポスト

on:
  schedule:
    # 1号店・2号店（日中〜夜 1日5回：06:53, 09:53, 12:12, 17:53, 20:53 JST）
    # 3号店・オニゴン（夜間集中 1日3回：20:53, 22:53, 00:23 JST）
    - cron: '53 21 * * *' # 06:53 JST（1・2号店：朝の通勤速報・7時枠）
    - cron: '53 0 * * *'  # 09:53 JST（1・2号店：午前の知恵袋・10時枠）
    - cron: '12 3 * * *'  # 12:12 JST（1・2号店：お昼休みのスマホ閲覧ピーク・12時15分枠）
    - cron: '53 8 * * *'  # 17:53 JST（1・2号店：退勤・夕方ハック・18時枠）
    - cron: '53 11 * * *' # 20:53 JST（1・2号店：夜まとめ ＋ 3号店：夜更かし第1便・21時枠）
    - cron: '53 13 * * *' # 22:53 JST（3号店専用：夜更かし第2便・23時ベッドイン＆ASMR枠）
    - cron: '23 15 * * *' # 00:23 JST（3号店専用：夜更かし第3便・深夜0時半ピーク枠）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Node.js環境のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 新着記事の自動生成＆静的サイトビルド（1号店＋2号店＋3号店＋4号店）
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          ADULT_ADMAX_TAG_ID: ${{ secrets.ADULT_ADMAX_TAG_ID }}
        run: |
          python3 scripts/generate_articles.py
          python3 store2/scripts/generate_articles.py
          python3 store3/scripts/generate_articles.py
          python3 store3/scripts/fetch_dmm_newcomers.py
          python3 store4/scripts/generate_articles.py
          python3 scripts/build_site.py --build-only
          python3 store3/scripts/build_site.py
          python3 store4/scripts/build_site.py

      - name: Cloudflare Pagesへ本番自動デプロイ（1号店＋2号店＋3号店＋4号店）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 1号店 (kouteki-lifehack) の本番ブランチを取得してデプロイ
          PROD_BRANCH_1=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/kouteki-lifehack" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',{}).get('production_branch','main'))" 2>/dev/null || echo "main")
          echo "Deploying Store 1 to production branch: ${PROD_BRANCH_1}"
          npx wrangler pages deploy dist --project-name=kouteki-lifehack --branch="${PROD_BRANCH_1}" --commit-dirty=true
          if [ "${PROD_BRANCH_1}" != "main" ]; then
            npx wrangler pages deploy dist --project-name=kouteki-lifehack --branch=main --commit-dirty=true || true
          fi

          # 2号店 (cosme-lab-ikero) の本番ブランチを取得してデプロイ
          PROD_BRANCH_2=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/cosme-lab-ikero" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',{}).get('production_branch','main'))" 2>/dev/null || echo "main")
          echo "Deploying Store 2 to production branch: ${PROD_BRANCH_2}"
          (cd store2 && npx wrangler pages deploy dist --project-name=cosme-lab-ikero --branch="${PROD_BRANCH_2}" --commit-dirty=true)
          if [ "${PROD_BRANCH_2}" != "main" ]; then
            (cd store2 && npx wrangler pages deploy dist --project-name=cosme-lab-ikero --branch=main --commit-dirty=true) || true
          fi

          # 3号店 (onigon-night-lab) の本番ブランチを取得してデプロイ
          PROD_BRANCH_3=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/onigon-night-lab" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',{}).get('production_branch','main'))" 2>/dev/null || echo "main")
          echo "Deploying Store 3 to production branch: ${PROD_BRANCH_3}"
          (cd store3 && npx wrangler pages deploy dist --project-name=onigon-night-lab --branch="${PROD_BRANCH_3}" --commit-dirty=true)
          if [ "${PROD_BRANCH_3}" != "main" ]; then
            (cd store3 && npx wrangler pages deploy dist --project-name=onigon-night-lab --branch=main --commit-dirty=true) || true
          fi

          # 4号店 (buzzhack-zeus) の本番ブランチを取得してデプロイ
          (cd store4 && npx wrangler pages project create buzzhack-zeus --production-branch=main 2>/dev/null || true)
          (cd store4 && npx wrangler pages deploy dist --project-name=buzzhack-zeus --branch=main --commit-dirty=true || true)

      # X（旧Twitter）への投稿・フォロー・片思い解除は別PCのローカルブラウザ自動運用（local_pc_x_automation/）へ完全移行済（API課金 $0.00）

      - name: 生成した記事・ビルド成果物・投稿履歴をGitHubに自動コミット＆保存
        run: |
          git config --global user.name "Hoporin AutoBot"
          git config --global user.email "bot@kouteki-lifehack.pages.dev"
          git add -A articles/ dist/ store2/articles/ store2/dist/ store3/articles/ store3/dist/ store4/articles/ store4/dist/ 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore(auto): 1〜4号店の記事更新＆本番デプロイ同期 [skip ci]" && git push)
