name: 1日5回 記事自動更新＆X自動分散ポスト

on:
  schedule:
    # 1日5回（日本時間 JST 07:00, 10:00, 12:15, 18:00, 21:00）に自動分散配信
    - cron: '0 22 * * *'  # 07:00 JST（朝の通勤速報）
    - cron: '0 1 * * *'   # 10:00 JST（午前の知恵袋）
    - cron: '15 3 * * *'  # 12:15 JST（お昼休みのスマホ閲覧ピーク）
    - cron: '0 9 * * *'   # 18:00 JST（退勤・夕方ハック）
    - cron: '0 12 * * *'  # 21:00 JST（夜のリラックス・まとめ）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Node.js環境のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 新着記事の自動生成
        run: |
          python3 scripts/generate_articles.py

      - name: 静的Webサイトのビルド＆X自動ポスト（1号店＋2号店）
        run: |
          python3 scripts/build_site.py

      - name: Cloudflare Pagesへ自動デプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name=kouteki-lifehack --commit-dirty=true

      - name: 生成した記事と投稿履歴をGitHubに自動コミット＆保存
        run: |
          git config --global user.name "Hoporin AutoBot"
          git config --global user.email "bot@kouteki-lifehack.pages.dev"
          git add -A articles/ store2/articles/ .tweet_history.json store2/.tweet_history.json 2>/dev/null || true
          git commit -m "chore(auto): 記事更新＆X投稿履歴同期 [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"
